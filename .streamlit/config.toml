# Streamlit 테마 — 화이트 + 블루 포인트. 실행기가 저장소 루트를 cwd 로 잡아 이 파일을 읽는다.
[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F7FA"
textColor = "#111827"
font = "sans serif"
baseRadius = "6px"
borderColor = "#E3E8EF"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
